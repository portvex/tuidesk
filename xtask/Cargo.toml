[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Release tooling for tuidesk: `cargo xtask dist`"

[dependencies]
anyhow = "1"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
