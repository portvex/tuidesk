# CI: the same checks as the git hooks (.cargo-husky/hooks), for pushes and pull requests to
# main. The `checks` job is a required status check on main, and the release workflow calls
# this one before building.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny,cargo-audit
      # The end-to-end tests drive tuidesk inside tmux.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # install-action does not carry gitleaks; use its release binary.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # pre-commit
      - name: gitleaks
        run: gitleaks git --redact -v .
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --quiet -- -D warnings

      # pre-push
      - name: tests with coverage check
        run: scripts/coverage.sh --check
      - name: cargo deny
        run: cargo deny check --hide-inclusion-graph
      - name: cargo audit
        run: cargo audit
