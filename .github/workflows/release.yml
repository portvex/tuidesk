# Release: on a pushed tag v<version>, run the CI checks (ci.yml), build every artifact
# `cargo xtask dist` can make, and publish them as a GitHub release. Linux, Windows, the source
# tarball and the recipes are built on Linux; the universal macOS executable needs a macOS host.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tuidesk") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml

  dist-linux:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      # Naming the kinds makes a missing tool an error instead of a skipped package. The source
      # tarball comes first, while the checkout is still clean of build output.
      - run: cargo xtask dist source linux deb rpm windows --out dist
      # The release job writes one SHA256SUMS over the artifacts from every host.
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  dist-macos:
    needs: [version, checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask dist macos --out dist
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  release:
    needs: [dist-linux, dist-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The Homebrew formula installs the macOS and Linux executables, so the recipes are made
      # once both hosts' tarballs are here (the source tarball is reused, not rebuilt).
      - run: cargo xtask dist recipes --out dist && rm dist/SHA256SUMS
      # Release assets are flat: the recipes (PKGBUILD, APKBUILD, tuidesk.rb) go next to the
      # packages, and SHA256SUMS covers everything uploaded.
      - name: Collect assets
        run: |
          mkdir assets
          find dist -type f -exec cp {} assets/ \;
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --title "tuidesk ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
      # The tap is pushed with a deploy key that can write to portvex/homebrew-tap only.
      - name: Update the Homebrew tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/tap-key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:portvex/homebrew-tap.git "$RUNNER_TEMP/tap"
          cp dist/packaging/homebrew/Formula/tuidesk.rb "$RUNNER_TEMP/tap/Formula/tuidesk.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/tuidesk.rb
          if git diff --cached --quiet; then
            echo "the tap already has this formula"
          else
            git -c user.name=portvex -c user.email=347037878+portvex@users.noreply.github.com \
              commit -m "tuidesk ${GITHUB_REF_NAME#v}"
            git push origin HEAD
          fi
