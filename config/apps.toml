# Built-in Kickoff catalogue: well-known terminal programs. Entries whose program is not
# installed are hidden (general.hide_missing_apps). [[apps]] in config.toml are added to
# this list, or replace the entry with the same name; general.hidden_apps removes entries.
# "command" runs through /bin/sh, so arguments and pipes work.

# ---------------------------------------------------------------- System
[[apps]]
name = "Terminal"
command = "$SHELL"
category = "System"
description = "Interactive shell"

[[apps]]
name = "System Monitor"
command = "btop"
category = "System"
description = "btop resource monitor"

[[apps]]
name = "Processes"
command = "htop"
category = "System"
description = "htop process viewer"

[[apps]]
name = "Bottom"
command = "btm"
category = "System"
description = "bottom system monitor"

[[apps]]
name = "Glances"
command = "glances"
category = "System"
description = "Glances system overview"

[[apps]]
name = "Docker"
command = "lazydocker"
category = "System"
description = "lazydocker container manager"

[[apps]]
name = "Kubernetes"
command = "k9s"
category = "System"
description = "k9s cluster manager"

[[apps]]
name = "Log Viewer"
command = "lnav"
category = "System"
description = "lnav log file navigator"

