# cargo-deny policy: run `cargo deny check` (or `cargo supply-chain`).

[graph]
all-features = false

[advisories]
version = 2
# Security advisories always fail; unmaintained crates and yanked versions too.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
]
# MPL-2.0 (file-level copyleft) is fine for an unmodified dependency, so it is allowed only
# for the crate that needs it (option-ext, via dirs).
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]
# tuidesk itself is not published.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
